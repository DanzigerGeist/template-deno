name: PR Checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  commits:
    name: Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Conventional commits check
        uses: wagoid/commitlint-github-action@v6

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x
          cache: true
      - name: Verify dependencies and lockfile
        run: deno install --frozen

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - dependencies
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x
          cache: true
      - name: Check formatting
        run: deno fmt --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - dependencies
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x
          cache: true
      - name: Run lint checks
        run: deno lint

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - dependencies
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x
          cache: true
      - name: Type check
        run: deno check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - dependencies
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x
          cache: true
      - name: Check docs
        run: deno doc --lint src/ && deno check --doc-only src/

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - dependencies
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x
          cache: true
      - name: Run tests
        run: deno test tests/ --coverage=.coverage --parallel --quiet --fail-fast --allow-all --permit-no-files

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - dependencies
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x
          cache: true
      - name: Audit dependencies
        run: deno task security:vulnerabilities

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
